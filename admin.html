<!DOCTYPE html>
<html>
<object-fit>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DON Admin Pro</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial;display:flex;justify-content:center;padding:20px}
.panel{background:#181818;width:100%;max-width:450px;padding:25px;border-radius:20px;border:1px solid #333}
h2{color:#ff0033;text-align:center} label{font-size:12px;opacity:0.6;margin-top:15px;display:block}
input,select,textarea{width:100%;background:#222;border:1px solid #333;padding:12px;border-radius:10px;color:white;margin-top:5px;box-sizing:border-box}
button{width:100%;background:#ff0033;border:0;padding:14px;border-radius:10px;color:white;font-weight:900;margin-top:20px;font-size:16px}
img#preview{width:100%;height:200px;object-fit:cover;border-radius:10px;margin-top:10px;display:none}
</style>
</object-fity>
<div class="panel">
<h2>👑 DON ADMIN PRO</h2>
<label>News Image URL</label>
<input id="img" placeholder="Paste image link" onkeyup="document.getElementById('preview').src=this.value;document.getElementById('preview').style.display='block'">
<img id="preview">

<label>Category</label>
<select id="cat"><option>Breaking</option><option>One Piece</option><option>Jujutsu Kaisen</option><option>Solo Leveling</option><option>Manga Leak</option></select>

<label>Title</label>
<input id="title" placeholder="Ex: Goku Ultra Instinct Returns">

<label>Description (1000 words)</label>
<textarea id="desc" rows="4" placeholder="Full news here..."></textarea>

<button onclick="publish()">🚀 PUBLISH NOW</button>
<p style="text-align:center;font-size:12px;margin-top:15px;opacity:0.5"><a href="index.html" style="color:#ff0033">View Website →</a></p>
</div>

<script>
function publish(){
let news = {
img: document.getElementById("img").value,
cat: document.getElementById("cat").value,
title: document.getElementById("title").value,
desc: document.getElementById("desc").value,
date: new Date().toLocaleString()
};
if(!news.img || !news.title){alert("Image aur Title to daal Don!");return}
let old = JSON.parse(localStorage.getItem("myNews") || "[]");
old.push(news);
localStorage.setItem("myNews", JSON.stringify(old));
alert("Published Successfully 🔥");
location.href="index.html";
}
</script>
</body>
</html>

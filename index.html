<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIME NEWS DON - Official</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial}
.header{background:#111;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff0033;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px} .logo span{color:#ff0033}
.search{background:#222;border:0;padding:8px 15px;border-radius:20px;color:white;width:140px}
.hero{padding:30px 20px;background:linear-gradient(to right,#ff0033,#6600ff)}
.hero h1{margin:0;font-size:28px} .hero p{opacity:0.8}
.grid{display:grid;grid-template-columns:1fr;gap:15px;padding:20px}
.card{background:#181818;border-radius:15px;overflow:hidden;border:1px solid #2a2a2a}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:15px} .tag{background:#ff0033;font-size:10px;padding:3px 8px;border-radius:5px}
.card h3{margin:10px 0 5px 0} .card p{font-size:13px;opacity:0.7;line-height:1.4}
.time{font-size:11px;opacity:0.5;margin-top:10px}
.footer{text-align:center;padding:20px;opacity:0.4;font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="header">
<div class="logo">ANIME NEWS <span>DON</span></div>
<input class="search" id="search" placeholder="Search..." onkeyup="filterNews()">
</div>
<div class="hero">
<h1>🔥 BREAKING ANIME NEWS</h1>
<p>Fastest Anime Updates</p>
</div>

<div class="grid" id="box"></div>
<div class="footer">© 2026 ANIME NEWS DON | Made by DON</div>

<script>
let allNews = JSON.parse(localStorage.getItem("myNews") || "[]");
let box = document.getElementById("box");
function show(list){
box.innerHTML = "";
if(list.length==0){box.innerHTML="<p style='opacity:0.5;padding:20px'>No news yet. Upload from admin.html</p>";return}
list.slice().reverse().forEach(n=>{
box.innerHTML+=`<div class="card"><img src="${n.img}"><div class="card-body"><span class="tag">${n.cat}</span><h3>${n.title}</h3><p>${n.desc}</p><div class="time">${n.date}</div></div></div>`
});
}
function filterNews(){
let q=document.getElementById("search").value.toLowerCase();
let f=allNews.filter(n=>n.title.toLowerCase().includes(q));
show(f);
}
show(allNews);
</script>
</body>
</html>
